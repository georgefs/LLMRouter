# semantic-router 配置，整合 LLMRouter 作為 RL-driven router
# 使用 LLMRouter endpoint 作為 router_r1_server_url 進行智能路由決策

version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 300s

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 模型定義
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

providers:
  defaults:
    default_model: gpt-4
    default_reasoning_effort: medium

  models:
    # 模型 1: GPT-4 (高能力，較慢，較貴)
    - name: gpt-4
      provider_model_id: gpt-4
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 30.0
        completion_per_1m: 60.0
      backend_refs:
        - name: openai-primary
          base_url: https://api.openai.com/v1
          provider: openai
          api_key_env: OPENAI_API_KEY
          weight: 100

    # 模型 2: GPT-3.5-turbo (中等能力，中等速度，便宜)
    - name: gpt-3.5-turbo
      provider_model_id: gpt-3.5-turbo
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0.5
        completion_per_1m: 1.5
      backend_refs:
        - name: openai-turbo
          base_url: https://api.openai.com/v1
          provider: openai
          api_key_env: OPENAI_API_KEY
          weight: 100

    # 模型 3: Claude-3 (高能力，快速)
    - name: claude-3
      provider_model_id: claude-3-sonnet-20240229
      api_format: anthropic
      pricing:
        currency: USD
        prompt_per_1m: 3.0
        completion_per_1m: 15.0
      backend_refs:
        - name: anthropic-primary
          base_url: https://api.anthropic.com
          provider: anthropic
          api_key_env: ANTHROPIC_API_KEY
          weight: 100

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 路由配置
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

routing:
  modelCards:
    - name: gpt-4
      param_size: 8B
      type: large

    - name: gpt-3.5-turbo
      param_size: medium
      type: base

    - name: claude-3
      param_size: medium
      type: large

  # 決策配置 - 定義不同的路由策略
  decisions:
    # catch-all: rules.conditions 空陣列匹配所有請求（confidence=0）
    # 若有其他帶 signal 條件的 decision，它們因 confidence 較高會優先
    - name: general
      description: "General purpose queries (catch-all)"
      priority: 1
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: gpt-3.5-turbo
          weight: 0.4
        - model: gpt-4
          weight: 0.3
        - model: claude-3
          weight: 0.3
      default_model: gpt-3.5-turbo
      algorithm:
        type: rl_driven
        rl_driven:
          enable_llm_routing: true
          # Docker 部署: 使用 bridge gateway IP，不可用 localhost/127.0.0.1
          # 查詢方式: docker network inspect vllm-sr-network | grep Gateway
          router_r1_server_url: "http://172.21.0.1:8123"
          llm_routing_fallback: thompson
          exploration_rate: 0.15
          exploration_decay: 0.97
          min_exploration: 0.03
          use_thompson_sampling: true
          cost_awareness: true
          cost_weight: 0.2
          use_router_r1_rewards: true
          cost_reward_alpha: 0.3
          format_reward_penalty: -1.0
          storage_path: state/rl-driven.json
          auto_save_interval: 30s

