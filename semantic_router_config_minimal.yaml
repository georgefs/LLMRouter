# semantic-router 簡化配置
# 最小化設置，只保留核心配置和 LLMRouter 整合

version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 300s

providers:
  defaults:
    default_model: gpt-4

  models:
    - name: gpt-4
      provider_model_id: gpt-4
      api_format: openai
      backend_refs:
        - name: openai
          base_url: https://api.openai.com/v1
          provider: openai
          api_key_env: OPENAI_API_KEY
          weight: 100

    - name: gpt-3.5-turbo
      provider_model_id: gpt-3.5-turbo
      api_format: openai
      backend_refs:
        - name: openai
          base_url: https://api.openai.com/v1
          provider: openai
          api_key_env: OPENAI_API_KEY
          weight: 100

    - name: claude-3
      provider_model_id: claude-3-sonnet-20240229
      api_format: anthropic
      backend_refs:
        - name: anthropic
          base_url: https://api.anthropic.com
          provider: anthropic
          api_key_env: ANTHROPIC_API_KEY
          weight: 100

routing:
  modelCards:
    - name: gpt-4
    - name: gpt-3.5-turbo
    - name: claude-3

  decisions:
    - name: general
      description: "General purpose queries"
      priority: 1
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: gpt-3.5-turbo
          weight: 0.33
        - model: gpt-4
          weight: 0.33
        - model: claude-3
          weight: 0.34
      default_model: gpt-3.5-turbo
      algorithm:
        type: rl_driven
        rl_driven:
          enable_llm_routing: true
          router_r1_server_url: "http://172.21.0.1:8123"
          llm_routing_fallback: thompson
          exploration_rate: 0.15
          exploration_decay: 0.97
          min_exploration: 0.03
          use_thompson_sampling: true
          cost_awareness: true
          cost_weight: 0.2
          use_router_r1_rewards: true
          cost_reward_alpha: 0.3
          format_reward_penalty: -1.0
          storage_path: state/rl-driven.json
          auto_save_interval: 30s

